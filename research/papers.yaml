covidhospit:
    title: "Caractéristiques socioéconomiques des individus aux formes sévères de Covid-19 au fil des vagues épidémiques"
    authors:
        - me
        - Olivier Meslin
        - Simon Delage
        - Noémie Courtejoie
    year: 2022
    published_url: https://drees.solidarites-sante.gouv.fr/sites/default/files/2022-03/dd96.pdf
    venue: Etudes et Résultats (DREES)
    summary: |
        Les résultats principaux de l'étude sont les suivants:
        
        - Si l'étude confirme que l'__âge est le facteur de risque prépondérant d'hospitalisation__, elle met en évidence d'autres facteurs de risque ;
        - La population hospitalisée réside dans des __logements plus densément occupés et appartenant plus fréquemment au parc social__ ;
        - Un __risque d'hospitalisation décroissant avec le niveau de vie__ ;
        - Une population hospitalisée __plus souvent née à l'étranger__ ;
        - La __quatrième vague se distingue__ des vagues précédentes, ce qui pourrait traduire les effets des campagnes de vaccination ;
        - Le risque de décéder à l'hôpital reste légèrement __moins élevé chez les personnes aux plus hauts revenus__ ;
iasegregation:
    title: "La mixité sociale est plus forte en journée sur les lieux d'activité que pendant la nuit dans les quartiers de résidence"
    authors:
        - me
        - Benjamin Sakarovitch
        - François Sémécurbe
        - Zbigniew Smoreda
    year: 2020
    preprint: 
    published_url: https://www.insee.fr/fr/statistiques/4930403
    venue: Insee Analyses
    github:
    cite: "dreescovid.bib"
    abstract: |
        Les données de mobilité issues de la téléphonie mobile permettent
        d'analyser la mixité sociale au-delà des seuls lieux de résidence.
        En effet, les personnes à hauts revenus et à bas revenus se déplacent et
        ainsi se côtoient pendant la journée.
        
        La mixité sociale est plus importante en journée
        lorsque les personnes sont en dehors de leur lieu de résidence dans
        les agglomérations de Paris, Lyon et Marseille.
        La ségrégation est minimale entre 10 heures et 18 heures quand
        la plupart des gens ont rejoint leur lieu de travail, alors qu'elle est maximale la nuit.
        
        Bien que la mixité sociale augmente avec les déplacements en journée,
        les personnes à bas revenus restent majoritaires dans le nord-est de
        l'agglomération parisienne et les personnes à hauts revenus dans l'ouest.
        La différence entre le jour et la nuit est plus marquée à l'ouest qu'à l'est.
        
        Dans les villes, l'organisation
        des infrastructures de transport entre
        le centre et la périphérie facilite ou, au contraire,
        freine les déplacements.
        Les personnes à bas revenus habitent plus souvent dans les espaces
        où il est plus difficile de se déplacer (centre à Marseille, périphérie à Lyon et Paris).

iacovid:
    title: "Retour partiel des mouvements de population avec le déconfinement"
    authors:
        - me
        - Milena Suarez-Castillo
        - François Sémécurbe
        - Elise Coudin
        - Marie Pierre de Bellefon
    year: 2020
    preprint: 
    published_url: https://www.insee.fr/fr/statistiques/4635407
    venue: Insee Analyses
    github:
    cite: "iacovid.bib"
    abstract: |
        D'après ses estimations construites à partir de comptages issus de la téléphonie mobile,
        l'Insee estime que 1,4 million de résidents de France métropolitaine ont
        rejoint leur département de résidence
        à la mise en place du confinement le 17 mars 2020 (solde des arrivées et des départs).
        
        Lors de la première phase de déconfinement
        pendant laquelle les déplacements étaient limités à 100 kilomètres
        (entre le 11 mai et le 2 juin), la répartition de la population
        sur le territoire est restée proche de celle observée pendant le confinement.
        Toutefois, le déconfinement s'est traduit par un retour
        partiel de population en dehors de son lieu de résidence.
        Ainsi, par rapport à la période avant confinement,
        le surcroît de résidents de France métropolitaine dans
        leur département de résidence n'est plus que de 646 000 personnes,
        contre 1,4 million de personnes pendant le confinement.
        À Paris, la mise en place du confinement avait
        engendré de nombreux départs qui concernaient autant le retour
        de « non-Parisiens » vers leur lieu de résidence que le
        départ de Parisiens quittant la capitale. 
        
        Avec le déconfinement, la population revient partiellement à Paris,
        en particulier en semaine et il s'agit essentiellement de non-Parisiens.
        Plus généralement, les mouvements hebdomadaires entre pôles urbains
        en semaine et départements plus ruraux et littoraux le week-end reprennent.
segregation:
    title: "Residential segregation, daytime segregation and spatial frictions: an analysis from mobile phone data"
    authors:
        - me
        - Benjamin Sakarovitch
        - François Sémécurbe
        - Zbigniew Smoreda
    year: 2020
    published_url: https://www.insee.fr/en/statistiques/4925202
    venue: Working Paper INSEE
    github:
    cite: "segregation2020.bib"
    abstract: |
        We bring together mobile phone and geocoded tax data on the three biggest
        French cities to shed a new light on segregation that accounts for population flows.
        Mobility being a key factor to reduce spatial segregation,
        we build a gravity model on an unprecedent scale to estimate the heterogeneity
        in travel costs.
        
        Residential segregation represents the acme of segregation.
        Low-income people spread more than high-income people during the day.
        Distance plays a key role to limit population flows.
        Low-income people live in neighbourhoods where the spatial frictions are strongest.

wealthlifecycle:
    title: "Private Wealth Over the Life Cycle: A Meeting Between Microsimulation and Structural Approaches"
    authors:
        - me
        - Lionel Wilner
    year: 2024
    preprint: https://hal.science/hal-04799408v1
    published_url: https://doi.org/10.1111/roiw.12697
    venue: Review of Income and Wealth
    github:
    cite: "wealthlifecycle.bib"
    abstract: |
        This paper embeds a structural model of private wealth accumulation over the life cycle within a dynamic microsimulation model designed for long‐run projections of pensions. In such an environment, the optimal savings path results from consumption smoothing and bequests motives, on top of the mortality risk. Preferences are estimated based on a longitudinal wealth survey through a method of simulated moments. Simulations issued from these estimations replicate quite well a private wealth that is more concentrated than labor income. They enable us to compute “augmented” standards of living including capital income, hence to quantify both the countervailing role played by private wealth to earnings dropout after retirement and the impact of the mortality risk in this regard.

parquetdiffusion:
    title: "Le format Parquet pour la diffusion de données : un choix technique au service des utilisateurs"
    authors:
        - Cédric Bobinec
        - me
    year: 2025
    published_url: https://insee.hal.science/hal-05620130v1
    venue: 15e Journées de méthodologie statistique de l'Insee (JMS 2025)
    github:
    cite: "parquetdiffusion.bib"
    abstract: |
        La diffusion et l'exploitation de microdonnées se heurte souvent à des freins techniques liés au volume des fichiers et à la complexité de leur exploitation. Le format Parquet, issu à l'origine de l'écosystème big data mais s'étant diffusé bien au-delà de cette sphère, s'impose comme une alternative efficace aux formats traditionnels comme le CSV. Cette présentation reviendra sur les expériences de diffusion de données dans ce format. Ce choix technique, associé à un accompagnement des utilisateurs (guides, exemples de code), a permis d'accroître l'usage de ces sources qui étaient, auparavant, complexes à valoriser. Cette communication évoquera également les implications pratiques de ce choix technique, les bonnes pratiques à mettre en œuvre lors de l'adoption de ce format de données et les opportunités d'innovation permises par ce format.

reproductibilitejms:
    title: "La reproductibilité au service de la recherche et de la mise en production de projets statistiques"
    authors:
        - Romain Avouac
        - me
    year: 2025
    published_url: https://insee.hal.science/hal-05624778v1
    venue: 15e Journées de méthodologie statistique de l'Insee (JMS 2025)
    github:
    cite: "reproductibilitejms.bib"
    abstract: |
        La crise de la reproductibilité observée dans la littérature scientifique depuis le milieu des années 2000 et les échecs de mise en production en contexte industriel renvoient souvent à un même phénomène : l’impossibilité de reconstruire, à coût raisonnable, les conditions ayant conduit à un résultat. 
        
        Cet article, reprenant de manière succincte des éléments de Avouac et Galiana (2025), adopte une position pragmatique : la reproductibilité « parfaite » est atteignable de manière coûteuse et n’est pas toujours nécessaire, mais un niveau minimal, utile au quotidien, peut être obtenu avec un ensemble restreint de pratiques et d’outils largement disponibles.
        
        Nous proposons une grille de lecture fondée sur la séparation de trois composantes d’un projet empirique, fréquemment entremêlées : données, code et configuration. Nous décrivons brièvement les outils et gestes permettant de rendre chaque composantes plus transparente et reproductible.

metiersdata:
    title: "Qu'apportent les métiers de la data à la statistique publique ?"
    authors:
        - me
        - Olivier Lefebvre
    year: 2026
    published_url: https://insee.hal.science/hal-05684911v1
    venue: Courrier des Statistiques, n°15
    github:
    cite: "metiersdata.bib"
    abstract: |
        La numérisation progressive des données a profondément transformé la production d'information, dans un contexte où les progrès technologiques et méthodologiques ont amélioré l'efficience des outils informatiques. Parallèlement, la société s'est acculturée à disposer en permanence de statistiques dans le débat public et dans le quotidien, et les entreprises utilisent de plus en plus de données dans leurs processus de décision. Face à ces besoins, il existe une forte demande sur le marché du travail pour des profils spécialisés dans la valorisation de données : data analysts, data scientists, data engineers, data journalists...
        
        Ces profils favorisent un rapprochement des compétences entre directions métiers et informatiques, ce qui a de nombreuses vertus : possibilité de réduire les délais de livraison, capacité à associer des données de formes et de natures diverses pour répondre à de nouveaux besoins, production plus transparente… Mais cela représente aussi un défi d'adaptation continue, dans un environnement où les besoins, les outils et les méthodes évoluent rapidement.
        
        La statistique publique tire pleinement parti de ces transformations au service de missions inchangées (éclairer le débat public et aider à la décision publique) et de valeurs essentielles (rigueur, transparence, respect de la confidentialité…). L'Insee et les services statistiques ministériels se sont dotés d'infrastructures et d'organisations pour explorer, expérimenter, industrialiser et maintenir ces nouveaux processus.


