project:
  type: website

website:
  title: "Lino Galiana"
  description: "Personal website of Lino Galiana"
  site-url: https://linogaliana.fr
  repo-url: https://github.com/linogaliana/website
  open-graph: true
  #favicon: favicon.png
  twitter-card: 
    creator: "@linogaliana"
    site: "@linogaliana"
    card-style: "summary_large_image"
  navbar:
    foreground: light
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
      - href: research.qmd
      - href: posts.qmd
        text: Archive `LinkedIn`
      #- href: software.qmd
      #- href: blog.qmd

format:
  html:
    theme:
      light: [cosmo, theme-light.scss, fonts.scss]
      dark: [solar, theme-dark.scss, fonts.scss]
    # css: styles.css
    toc: true
    toc-depth: 4
    toc-title: "Contents"
    html-math-method: katex
    highlight-style: tango
    respect-user-color-scheme: true
